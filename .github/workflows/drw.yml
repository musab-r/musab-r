name: Runtime Workflow

on:
  schedule:
    # 14:15 UTC on the 1st of every month
    - cron: "15 14 1 * *"
  # Allows running it manually from the Actions tab
  workflow_dispatch:

# Read-only by default; only the job that commits gets write access.
permissions:
  contents: read

# Never let two runs push at the same time.
concurrency:
  group: readme-update
  cancel-in-progress: false

jobs:
  update-office-quote:
    name: Update README with a new Office quote
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      # Actions are pinned to exact commits so a moved tag can't change what runs.
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Generate README
        run: node index.js

      - name: Commit and push if README changed
        run: |
          if git diff --quiet -- README.md; then
            echo "README unchanged, nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "[Automated] README updated with new Office quote"
          git push
